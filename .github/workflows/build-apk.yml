name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak project dari zip
        run: unzip -q P2PTransfer.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          build-root-directory: P2PTransfer

      - name: Build debug APK
        working-directory: P2PTransfer
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: p2p-transfer-debug-apk
          path: P2PTransfer/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
